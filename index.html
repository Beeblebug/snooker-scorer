<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<meta name="apple-mobile-web-app-title" content="Snooker">
<meta name="theme-color" content="#0a2a1f">
<title>Snooker Scorer</title>
<style>
:root{
  --bg:#0a2a1f; --felt:#0f3a2b; --card:#14473a; --card2:#185443; --line:rgba(255,255,255,.09);
  --text:#f4f0e6; --muted:#a8c2b5; --accent:#e8c468; --accent-ink:#2b2205; --danger:#ef7b62; --good:#8fd6a5;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation;cursor:pointer}
#app{max-width:560px;margin:0 auto;min-height:100vh;padding:14px 16px calc(92px + env(safe-area-inset-bottom))}
#app.noTabs{padding-bottom:calc(24px + env(safe-area-inset-bottom))}
h1{font-size:28px;letter-spacing:-.02em;margin:6px 0 14px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:22px 0 8px;font-weight:600}
.muted{color:var(--muted)}
.small{font-size:13px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:40px}
.top .title{font-size:15px;color:var(--muted);text-align:center;flex:1}
.ticons{display:flex;justify-content:flex-end;min-width:64px}.icon2{background:none;border:none;color:var(--accent);font-size:20px;padding:8px 6px}
.back,.icon{background:none;border:none;color:var(--accent);font-size:16px;padding:8px 4px;min-width:64px;text-align:left}
.icon{text-align:right;font-size:20px;letter-spacing:2px;min-width:0!important}
.btn{display:block;width:100%;border:none;border-radius:14px;padding:15px;font-size:17px;font-weight:600;background:var(--card2);margin:8px 0}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:rgba(239,123,98,.15);color:var(--danger)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn:disabled{opacity:.4}
.link{background:none;border:none;color:var(--accent);padding:10px 0;font-size:15px}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin:8px 0}
.match .row{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;font-size:17px}
.match .row span:last-child{text-align:right}
.match .fs{font-variant-numeric:tabular-nums;font-weight:700;background:rgba(0,0,0,.2);padding:4px 10px;border-radius:8px}
.match .meta{font-size:13px;color:var(--muted);margin-top:6px}
.win{font-weight:700;color:var(--accent)}
.live{color:var(--good);font-weight:600}
.banner{background:rgba(232,196,104,.12);border:1px solid rgba(232,196,104,.3);color:var(--accent);padding:10px 12px;border-radius:12px;font-size:14px;margin:6px 0 10px}
label.f{display:block;margin:12px 0}
label.f span{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
select,input[type=text]{width:100%;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 12px;font-size:17px;-webkit-appearance:none;appearance:none}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;border:1px solid var(--line)}
.seg button{flex:1;border:none;background:none;padding:10px;border-radius:9px;font-size:15px}
.seg button.on{background:var(--card2);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.3)}
.addrow{display:flex;gap:8px}
.addrow input{flex:1}
.addrow button{width:auto;margin:0;padding:0 18px}

/* scoring */
.players{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:6px}
.pcard{background:var(--card);border:2px solid transparent;border-radius:18px;padding:12px 12px 14px;text-align:center;transition:border-color .15s,background .15s}
.pcard.on{border-color:var(--accent);background:var(--card2)}
.pcard .nm{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pcard .sc{font-size:56px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums;letter-spacing:-.03em;margin:4px 0}
.pcard .fr{font-size:13px;color:var(--muted)}
.pcard .brk{font-size:14px;color:var(--accent);font-weight:600;height:18px;margin-top:4px}
.strip{display:flex;justify-content:space-between;gap:6px;margin:12px 0 4px;font-size:14px;color:var(--muted)}
.strip b{color:var(--text);font-variant-numeric:tabular-nums}
.hint{text-align:center;font-size:14px;color:var(--muted);margin:6px 0 10px}
.hint b{color:var(--text)}
.redbtn{width:100%;height:64px;border-radius:32px;border:none;background:radial-gradient(circle at 30% 30%,#f04a5a,#b30f22 60%,#7c0614);color:#fff;font-size:19px;font-weight:700;box-shadow:inset 0 -4px 10px rgba(0,0,0,.3)}
.colours{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin-top:10px}
.ball{aspect-ratio:1;border-radius:50%;border:none;font-size:20px;font-weight:800;color:#fff;box-shadow:inset -5px -7px 12px rgba(0,0,0,.35),inset 4px 4px 8px rgba(255,255,255,.22);padding:0}
.ball.dark{color:#2a2208}
.ball:disabled,.redbtn:disabled{opacity:.16}
.ball.next{outline:3px solid var(--accent);outline-offset:3px}
.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:14px}
.actions button{border:none;border-radius:14px;padding:14px 2px;font-size:15px;font-weight:600;background:var(--card2)}
.actions .foul{background:rgba(239,123,98,.16);color:var(--danger)}
.actions button:disabled{opacity:.35}
.undo{grid-column:1/-1;background:transparent!important;border:1px solid var(--line)!important;font-weight:500!important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--card);border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:13px}
.chip b{font-variant-numeric:tabular-nums}
.done{background:linear-gradient(160deg,#1d5d49,#123f31);border:1px solid rgba(232,196,104,.35);border-radius:18px;padding:18px;text-align:center;margin-top:12px}
.done .big{font-size:22px;font-weight:700}
.done .sub{color:var(--muted);margin:6px 0 10px}

/* tables & stats */
table{width:100%;border-collapse:collapse;font-size:15px;font-variant-numeric:tabular-nums}
th,td{padding:9px 6px;border-bottom:1px solid var(--line);text-align:center}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
td.l,th.l{text-align:left;color:var(--muted)}
td.better{color:var(--accent);font-weight:700}
.tablecard{background:var(--card);border-radius:16px;padding:4px 12px;border:1px solid var(--line)}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 8px;text-align:center}
.tile .v{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.tile .k{font-size:12px;color:var(--muted);margin-top:2px}
.hero{text-align:center;margin:4px 0 8px}
.hero .fs{font-size:44px;font-weight:700;font-variant-numeric:tabular-nums}
.prow{display:flex;justify-content:space-between;align-items:center}
.prow .nm{font-size:17px;font-weight:600}
.prow .rt{color:var(--muted);font-size:14px;text-align:right}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:rgba(7,30,22,.94);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom);z-index:5}
.tabbar button{flex:1;max-width:190px;background:none;border:none;padding:10px 0 12px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px}
.tabbar button.on{color:var(--accent)}
.tabbar svg{width:24px;height:24px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:20}
.sheet.hidden{display:none}
.scrim{position:absolute;inset:0;background:rgba(0,0,0,.55)}
.panel-sheet{position:absolute;left:0;right:0;bottom:0;max-width:560px;margin:0 auto;background:#103d2f;border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.5}to{transform:none;opacity:1}}
.panel-sheet h3{margin:0 0 6px;font-size:20px}
.panel-sheet p{margin:4px 0 12px;color:var(--muted)}
.foulvals{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.foulvals button{border:none;border-radius:14px;padding:16px 0;font-size:20px;font-weight:700;background:rgba(239,123,98,.18);color:var(--danger)}
.stepper{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:6px 6px 6px 12px;margin:8px 0}
.stepper .ctl{display:flex;align-items:center;gap:10px}
.stepper button{width:40px;height:40px;border-radius:10px;border:none;background:var(--card2);font-size:22px}
.stepper b{min-width:20px;text-align:center;font-size:18px}
.check{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:12px;padding:12px;margin:8px 0}
.check input{width:22px;height:22px;accent-color:var(--accent)}
#toast.pb{background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:14px 18px;top:calc(16px + env(safe-area-inset-top));bottom:auto;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#f4f0e6;color:#132;padding:10px 16px;border-radius:12px;font-size:14px;z-index:30;max-width:90vw;display:none}
.coin{width:128px;height:128px;margin:22px auto 16px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fbe7a6,#d9ad3c 58%,#9a7418);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:24px;color:#4a3606;box-shadow:0 10px 24px rgba(0,0,0,.4),inset 0 0 0 6px rgba(255,255,255,.18);padding:10px;text-align:center;line-height:1.1}
.coin.spin{animation:flip 1.4s cubic-bezier(.2,.7,.3,1)}
@keyframes flip{0%{transform:translateY(0) rotateX(0)}45%{transform:translateY(-70px) rotateX(1080deg)}100%{transform:translateY(0) rotateX(1800deg)}}
.tossres{text-align:center;font-size:20px;font-weight:700;min-height:28px}
.pill{display:inline-block;font-family:inherit;cursor:pointer;font-size:13px;padding:5px 11px;border-radius:999px;background:var(--card);margin:-6px 0 10px;border:1px solid var(--line)}.pill.ok{color:var(--good)}.pill.warn{color:var(--accent)}
.code{font-size:34px;font-weight:800;letter-spacing:.12em;text-align:center;background:var(--card);border-radius:14px;padding:16px;margin:8px 0 12px;font-variant-numeric:tabular-nums;user-select:all;-webkit-user-select:all}
.twobtn{display:grid;grid-template-columns:1fr 1fr;gap:8px}.twobtn .btn{margin:0}
.board{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 30%,#155540,#071d16 75%);display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));z-index:10}
.bhead{display:flex;align-items:center;justify-content:space-between;gap:12px;color:var(--muted);font-size:clamp(14px,2.4vw,24px)}
.bexit{background:rgba(255,255,255,.08);border:none;border-radius:999px;width:44px;height:44px;font-size:20px;color:var(--text)}
.bplayers{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:clamp(8px,2vw,24px);margin:clamp(8px,2vh,20px) 0}
.bp{border-radius:clamp(16px,3vw,32px);border:3px solid transparent;background:rgba(255,255,255,.04);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:8px;min-width:0}
.bp.on{border-color:var(--accent);background:rgba(232,196,104,.08)}
.bp.won{border-color:var(--good)}
.bn{font-size:clamp(20px,min(5vw,7vh),64px);font-weight:700;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bs{font-size:clamp(72px,min(22vw,40vh),380px);font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em}
.bf{font-size:clamp(16px,min(3.4vw,5vh),44px);color:var(--muted)}.bf b{color:var(--text)}
.bb{font-size:clamp(18px,min(4vw,6vh),52px);font-weight:700;color:var(--accent);min-height:1.2em}
.bfoot{display:flex;justify-content:space-around;color:var(--muted);font-size:clamp(14px,min(3vw,4.5vh),34px)}.bfoot b{color:var(--text)}
.edrow{background:var(--card);border-radius:14px;padding:10px 12px;margin:8px 0}
.edh{display:flex;align-items:center;gap:12px}.edh b{flex:1}.edh .link{padding:4px 0;font-size:14px}
.edg{display:grid;grid-template-columns:1fr 1fr 1.3fr;gap:8px;margin-top:6px}
.edg label span{display:block;font-size:12px;color:var(--muted);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edg3{display:grid;grid-template-columns:1.4fr 1fr auto;gap:8px;margin:8px 0;align-items:center}.edg3 .btn{margin:0;width:48px;padding:12px 0}
input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:11px 10px;font-size:17px;color:var(--text)}
.edg select{padding:11px 10px;font-size:15px;background:var(--bg)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:10px 10px 8px}
.chart svg{width:100%;height:auto;display:block}
.cg{stroke:rgba(255,255,255,.1);stroke-width:1}.ct{fill:var(--muted);font-size:10px}.cv{fill:var(--text);font-size:11px;font-weight:600}
.cl{fill:none;stroke:var(--accent);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}.cd{fill:var(--accent);stroke:var(--card);stroke-width:2}
.cb{fill:var(--accent)}.ccap{font-size:13px;color:var(--muted);text-align:center;margin-top:4px;min-height:18px}
.form{display:flex;gap:6px;flex-wrap:wrap}.fm{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;background:var(--card);border:1px solid var(--line)}
.fm.W{background:rgba(143,214,165,.18);color:var(--good)}.fm.L{color:var(--danger)}
.drill{display:flex;gap:12px;align-items:center}.dinfo{flex:1;min-width:0}
.tbl-s{width:58px;flex:none;border-radius:4px}.tbl{width:100%;max-width:260px;display:block;margin:0 auto;border-radius:8px;box-shadow:0 6px 18px rgba(0,0,0,.35)}
.drillgrid{display:grid;gap:14px}@media(min-width:520px){.drillgrid{grid-template-columns:220px 1fr}}
.dtext{margin:0;line-height:1.5;font-size:15px}
.runbig{font-size:96px;font-weight:800;text-align:center;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:10px}
.dots{display:flex;justify-content:center;gap:6px;flex-wrap:wrap}.dot{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.dot.hit{background:rgba(143,214,165,.2);color:var(--good)}.dot.miss{background:rgba(239,123,98,.15);color:var(--danger)}
.big2{padding:22px 0!important;font-size:20px!important}
.tabbar button{min-width:0}
.seasonsel{margin-bottom:10px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet" class="sheet hidden"></div>
<div id="toast"></div>
<script src="firebase-config.js"></script>
<script src="firebase-bundle.js"></script>
<script>
"use strict";
/* ---------- constants & helpers ---------- */
const BALLS=[{v:1,n:'Red',c:'#c8102e'},{v:2,n:'Yellow',c:'#f2c94c',dark:1},{v:3,n:'Green',c:'#1f8a3b'},{v:4,n:'Brown',c:'#7b4a24'},{v:5,n:'Blue',c:'#1e56c8'},{v:6,n:'Pink',c:'#f4a3c0',dark:1},{v:7,n:'Black',c:'#161616'}];
const BALL_NAME=v=>BALLS[v-1].n;
const S={players:{},matches:{},practice:{},view:'home',param:null,ready:false,mode:'loading',note:'',draft:{p1:'',p2:'',bo:1,brk:0,h0:0,h1:0},histFilter:''};
let db=null;
const undoStacks={};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const pn=id=>(S.players[id]&&S.players[id].name)||'Unknown';
const fmtDate=ts=>ts?new Date(ts).toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'}):'';
const pct=(a,b)=>b>0?Math.round(a*100/b)+'%':'–';
const boLabel=m=>m.bestOf>0?'Best of '+m.bestOf:'Open match';

/* ---------- storage (on this device) ---------- */
const LS='snooker-scorer-v1';
let idb=null;
function lsLoad(){try{const d=JSON.parse(localStorage.getItem(LS)||'{}');S.players=d.players||{};S.matches=d.matches||{};S.practice=d.practice||{};}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({players:S.players,matches:S.matches,practice:S.practice}));}catch(e){toast('Couldn’t save — storage on this device may be full.');}}
function idbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('snooker-scorer',1);
  r.onupgradeneeded=()=>{const d=r.result;['players','matches'].forEach(n=>{if(!d.objectStoreNames.contains(n))d.createObjectStore(n,{keyPath:'id'});});};
  r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);r.onblocked=()=>rej(new Error('blocked'));});}
function idbAll(store){return new Promise((res,rej)=>{const q=idb.transaction(store).objectStore(store).getAll();q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});}
function idbTx(store,fn){return new Promise((res,rej)=>{const tx=idb.transaction(store,'readwrite');fn(tx.objectStore(store));tx.oncomplete=()=>res();tx.onerror=()=>rej(tx.error);tx.onabort=()=>rej(tx.error);});}
async function persist(col,obj){
  if(S.group&&fb){window.FB.setDoc(gdoc(S.group.id,col,obj.id),clone(obj)).catch(syncErr);return;}
  if(!idb){lsSave();return;}
  try{await idbTx(col,st=>st.put(clone(obj)));}catch(e){toast('Couldn’t save — storage on this device may be full.');}
}
async function removeDoc(col,id){
  if(S.group&&fb){window.FB.deleteDoc(gdoc(S.group.id,col,id)).catch(syncErr);return;}
  if(!idb){lsSave();return;}
  try{await idbTx(col,st=>st.delete(id));}catch(e){toast('Couldn’t delete just now.');}
}
function syncErr(e){
  if(e&&e.code==='permission-denied'){S.note='This phone is no longer allowed into the group. Leave the group and join again with the code.';render();}
  else toast('Couldn’t sync that change.');
}

/* ---------- group sync (Firebase) ---------- */
const GKEY='snooker-group';
function groupCfg(){try{return JSON.parse(localStorage.getItem(GKEY)||'null');}catch(e){return null;}}
function setGroupCfg(g){try{if(g)localStorage.setItem(GKEY,JSON.stringify(g));else localStorage.removeItem(GKEY);}catch(e){}}
const fbConfigured=()=>!!(window.FB&&window.FIREBASE_CONFIG&&window.FIREBASE_CONFIG.apiKey&&window.FIREBASE_CONFIG.apiKey.indexOf('PASTE')<0);
let fb=null,unsubs=[];
S.group=null;S.sync={state:'off',pending:false};
const withTimeout=(p,ms)=>Promise.race([p,new Promise((_,r)=>setTimeout(()=>r(Object.assign(new Error('timeout'),{code:'timeout'})),ms))]);
function fbInit(){
  if(fb)return fb;
  const F=window.FB;const app=F.initializeApp(window.FIREBASE_CONFIG);
  let fs;
  try{fs=F.initializeFirestore(app,{localCache:F.persistentLocalCache({tabManager:F.persistentMultipleTabManager()}),ignoreUndefinedProperties:true});}
  catch(e){fs=F.initializeFirestore(app,{ignoreUndefinedProperties:true});}
  fb={app,fs,auth:F.getAuth(app)};return fb;
}
const gdoc=(gid,col,id)=>window.FB.doc(fb.fs,'groups',gid,col,id);
const gcol=(gid,col)=>window.FB.collection(fb.fs,'groups',gid,col);
function authUser(){return new Promise(res=>{const u=window.FB.onAuthStateChanged(fb.auth,user=>{u();res(user);});});}
async function ensureSignedIn(){
  fbInit();let u=await authUser();
  if(!u)u=(await withTimeout(window.FB.signInAnonymously(fb.auth),20000)).user;
  return u;
}
const CODE_CH='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
function genCode(){const a=new Uint32Array(8);crypto.getRandomValues(a);return Array.from(a,x=>CODE_CH[x%CODE_CH.length]).join('');}
const fmtCode=c=>c.slice(0,4)+'-'+c.slice(4);
const normCode=c=>String(c||'').toUpperCase().replace(/[^A-Z0-9]/g,'');
function stopSync(){unsubs.forEach(u=>{try{u();}catch(e){}});unsubs=[];}
async function startGroupSync(g){
  stopSync();
  S.group=g;S.mode='group';S.sync.state='connecting';render();
  try{fbInit();}catch(e){S.sync.state='error';S.note='Sync couldn’t start on this device.';S.ready=true;render();return;}
  let user=await authUser();
  if(!user&&navigator.onLine){try{user=(await withTimeout(window.FB.signInAnonymously(fb.auth),20000)).user;}catch(e){}}
  if(!user){S.sync.state='needsignin';S.ready=true;render();return;}
  const F=window.FB;const gid=g.id;let gotP=false,gotM=false;
  const timer=setTimeout(()=>{if(!S.ready){S.ready=true;render();}},8000);
  const upd=()=>{if(gotP&&gotM){S.ready=true;clearTimeout(timer);}S.sync.state='on';render();};
  const onErr=e=>{clearTimeout(timer);S.ready=true;S.sync.state='error';
    S.note=e&&e.code==='permission-denied'?'This phone is no longer allowed into the group. Leave the group and join again with the code.':'Sync stopped. Close and reopen the app to reconnect.';render();};
  unsubs.push(F.onSnapshot(gcol(gid,'players'),{includeMetadataChanges:true},snap=>{
    const o={};snap.docs.forEach(d=>{o[d.id]=d.data();});S.players=o;gotP=true;upd();},onErr));
  unsubs.push(F.onSnapshot(gcol(gid,'matches'),{includeMetadataChanges:true},snap=>{
    const o={},pr={};snap.docs.forEach(d=>{const r=d.data();if(r.kind==='practice'){pr[d.id]=r;return;}const loc=S.matches[d.id];o[d.id]=(loc&&(loc.updatedAt||0)>(r.updatedAt||0))?loc:r;});
    S.matches=o;S.practice=pr;S.sync.pending=snap.metadata.hasPendingWrites;gotM=true;upd();},onErr));
}
async function uploadLocal(gid,locPlayers,locMatches){
  const F=window.FB;
  const remote=await withTimeout(F.getDocsFromServer(gcol(gid,'players')),20000);
  const byName={};remote.forEach(d=>{const n=(d.data().name||'').toLowerCase();if(n)byName[n]=d.id;});
  const map={},writes=[];
  locPlayers.forEach(p=>{const ex=byName[p.name.toLowerCase()];if(ex){map[p.id]=ex;}else{map[p.id]=p.id;writes.push(['players',p.id,p]);}});
  locMatches.forEach(m=>{const c=clone(m);if(c.kind==='practice')c.player=map[c.player]||c.player;else c.p=c.p.map(x=>map[x]||x);writes.push(['matches',c.id,c]);});
  for(let i=0;i<writes.length;i+=400){
    const b=F.writeBatch(fb.fs);
    writes.slice(i,i+400).forEach(([col,id,data])=>b.set(gdoc(gid,col,id),clone(data)));
    await withTimeout(b.commit(),30000);
  }
}
async function localSnapshot(){
  if(!idb)return {players:Object.values(S.players),matches:Object.values(S.matches).concat(Object.values(S.practice))};
  const [ps,ms]=await Promise.all([idbAll('players'),idbAll('matches')]);return {players:ps,matches:ms};
}
let busy=false;
async function createGroup(name){
  if(busy)return;
  if(!navigator.onLine){toast('You need an internet connection to create a group.');return;}
  busy=true;sheetBusy('Creating your group…');
  try{
    const F=window.FB;const u=await ensureSignedIn();let gid=null;
    for(let i=0;i<5&&!gid;i++){const c=genCode();
      try{await withTimeout(F.setDoc(F.doc(fb.fs,'groups',c),{name,createdBy:u.uid,createdAt:Date.now()}),20000);gid=c;}
      catch(e){if(!e||e.code!=='permission-denied')throw e;}}
    if(!gid)throw new Error('nocode');
    await withTimeout(F.setDoc(gdoc(gid,'members',u.uid),{joinedAt:Date.now()}),20000);
    const loc=await localSnapshot();await uploadLocal(gid,loc.players,loc.matches);
    const g={id:gid,name};setGroupCfg(g);closeSheet();await startGroupSync(g);
    showCodeSheet();
  }catch(e){closeSheet();toast(e&&e.code==='permission-denied'?'Firebase refused the request — check the security rules were published.':'Couldn’t create the group. Check your connection and try again.');}
  busy=false;
}
async function joinGroup(input){
  if(busy)return;
  const gid=normCode(input);
  if(gid.length!==8){toast('Codes are 8 letters and numbers, like ABCD-2345');return;}
  if(!navigator.onLine){toast('You need an internet connection to join a group.');return;}
  busy=true;sheetBusy('Joining…');
  try{
    const F=window.FB;const u=await ensureSignedIn();
    try{await withTimeout(F.setDoc(gdoc(gid,'members',u.uid),{joinedAt:Date.now()}),20000);}
    catch(e){if(e&&e.code==='permission-denied'){closeSheet();toast('No group found with that code.');busy=false;return;}throw e;}
    const gs=await withTimeout(F.getDocFromServer(F.doc(fb.fs,'groups',gid)),20000);
    const name=(gs.exists()&&gs.data().name)||'Snooker group';
    const loc=await localSnapshot();await uploadLocal(gid,loc.players,loc.matches);
    const g={id:gid,name};setGroupCfg(g);closeSheet();await startGroupSync(g);toast('Joined '+name);
  }catch(e){closeSheet();toast('Couldn’t join the group. Check your connection and try again.');}
  busy=false;
}

async function exportData(){

async function importData(file){
  let d;
  try{d=JSON.parse(await file.text());}catch(e){toast('That file isn’t a Snooker Scorer backup.');return;}
  if(!d||d.app!=='snooker-scorer'||!Array.isArray(d.players)||!Array.isArray(d.matches)){toast('That file isn’t a Snooker Scorer backup.');return;}
  let np=0,nm=0;
  for(const p of d.players){if(!p||!p.id||!p.name)continue;if(!S.players[p.id]){S.players[p.id]=p;np++;await persist('players',p);}}
  for(const m of d.matches){if(!m||!m.id)continue;
    if(m.kind==='practice'){if(!m.player||!m.drill)continue;const cur=S.practice[m.id];if(!cur||(m.updatedAt||0)>(cur.updatedAt||0)){S.practice[m.id]=m;nm++;await persist('matches',m);}continue;}
    if(!Array.isArray(m.p)||!Array.isArray(m.frames))continue;const cur=S.matches[m.id];
    if(!cur||(m.updatedAt||0)>(cur.updatedAt||0)){S.matches[m.id]=m;nm++;await persist('matches',m);}}
  render();toast(np||nm?`Restored ${nm} match${nm===1?'':'es'} and ${np} player${np===1?'':'s'}`:'Nothing new in that backup');
}

/* ---------- scoring engine ---------- */
const newStats=()=>({pots:0,miss:0,saf:0,snk:0,fouls:0,foulPts:0,visits:0,shots:0,time:0});
function newFrame(breaker,hc){const h=hc||[0,0],now=Date.now();return {breaker,turn:breaker,scores:[h[0],h[1]],start:[h[0],h[1]],reds:15,phase:'red',next:2,cur:{pts:0,balls:[]},breaks:[],stats:[newStats(),newStats()],winner:null,conceded:false,freeBall:false,lastShotAt:now,startedAt:now,endedAt:null};}
const fstart=(f,i)=>f.start?f.start[i]||0:0;
function remaining(f){
  if(f.phase==='red')return f.reds*8+27;
  if(f.phase==='colour')return f.reds*8+7+27;
  if(f.phase==='clear'){let s=0;for(let v=f.next;v<=7;v++)s+=v;return s;}
  if(f.phase==='respot')return 7;
  return 0;
}
function allowed(f,v){
  if(f.winner!=null)return false;
  if(f.freeBall&&v>=2&&(f.phase==='red'||f.phase==='clear'))return true;
  if(f.phase==='red')return v===1&&f.reds>0;
  if(f.phase==='colour'){if(v===1){const b=f.cur.balls;return f.reds>0&&b.length>0&&b[b.length-1]===1;}return true;}
  if(f.phase==='clear')return v===f.next;
  if(f.phase==='respot')return v===7;
  return false;
}
function closeBreak(f){
  f.stats[f.turn].visits++;
  if(f.cur.pts>0)f.breaks.push({p:f.turn,pts:f.cur.pts,balls:f.cur.balls});
  f.cur={pts:0,balls:[]};
}
function leaveColour(f){
  if(f.phase==='colour'){f.phase=f.reds>0?'red':'clear';f.next=2;}
  else if(f.phase==='red'&&f.reds===0){f.phase='clear';f.next=2;}
}
function endFrame(f,w){
  if(f.cur.pts>0||f.cur.balls.length)closeBreak(f);
  f.winner=w;f.phase='done';f.endedAt=Date.now();
}
function framesWon(m,i){return m.frames.filter(f=>f.winner===i).length;}
function act(m,fn,shot){
  const st=undoStacks[m.id]||(undoStacks[m.id]=[]);
  st.push(clone(m));if(st.length>300)st.shift();
  const f=m.current;
  const wasOver=f.winner!=null;
  const pbBefore=pbSnapshot(m);
  const nb=f.breaks.length;
  if(shot&&!wasOver){const now=Date.now();const dt=Math.max(0,Math.min(now-(f.lastShotAt||f.startedAt||now),300000));const s=f.stats[f.turn];s.time=(s.time||0)+dt;s.shots=(s.shots||0)+1;f.lastShotAt=now;}
  fn(f,m);
  checkPB(m,pbBefore,f.breaks.slice(nb));
  if(!wasOver&&f.winner!=null){
    m.frames.push(clone(f));
    const need=m.bestOf>0?Math.floor(m.bestOf/2)+1:Infinity;
    const w0=framesWon(m,0),w1=framesWon(m,1);
    if(w0>=need||w1>=need){m.status='complete';m.winner=w0>w1?0:1;m.endedAt=Date.now();}
  }
  m.updatedAt=Date.now();
  persist('matches',m);
}
function doPot(m,v){
  const f=m.current;if(!allowed(f,v))return;
  act(m,f=>{
    const t=f.turn;
    if(f.freeBall){f.freeBall=false;
      if(f.phase==='red'&&v>=2){f.scores[t]+=1;f.cur.pts+=1;f.cur.balls.push(1);f.stats[t].pots++;f.phase='colour';return;}
      if(f.phase==='clear'&&v!==f.next){const val=f.next;f.scores[t]+=val;f.cur.pts+=val;f.cur.balls.push(val);f.stats[t].pots++;return;}
    }
    f.scores[t]+=v;f.cur.pts+=v;f.cur.balls.push(v);f.stats[t].pots++;
    if(f.phase==='red'){f.reds--;f.phase='colour';}
    else if(f.phase==='colour'){if(v===1){f.reds--;}else{f.phase=f.reds>0?'red':'clear';f.next=2;}}
    else if(f.phase==='clear'){
      if(v===7){
        if(f.scores[0]===f.scores[1]){closeBreak(f);f.phase='respot';f.next=7;}
        else endFrame(f,f.scores[0]>f.scores[1]?0:1);
      }else f.next++;
    }
    else if(f.phase==='respot'){endFrame(f,t);}
  },true);
}
function doEndTurn(m,kind){
  if(m.current.winner!=null)return;
  act(m,f=>{
    if(kind==='miss')f.stats[f.turn].miss++;else if(kind==='safety')f.stats[f.turn].saf++;else if(kind==='snooker')f.stats[f.turn].snk=(f.stats[f.turn].snk||0)+1;
    f.freeBall=false;closeBreak(f);leaveColour(f);f.turn=1-f.turn;
  },true);
}
function doFoul(m,value,redsOff,again,freeBall){
  if(m.current.winner!=null)return;
  act(m,f=>{
    const t=f.turn,o=1-t;f.freeBall=false;
    f.scores[o]+=value;f.stats[t].fouls++;f.stats[t].foulPts+=value;
    closeBreak(f);
    if(f.phase==='respot'){endFrame(f,o);return;}
    if(redsOff>0&&(f.phase==='red'||f.phase==='colour'))f.reds=Math.max(0,f.reds-redsOff);
    leaveColour(f);
    if(!again){f.turn=o;if(freeBall&&(f.phase==='red'||f.phase==='clear'))f.freeBall=true;}
  },true);
}
function doConcede(m,who){
  if(m.current.winner!=null)return;
  act(m,f=>{f.conceded=true;endFrame(f,1-who);});
}
function doUndo(m){
  const st=undoStacks[m.id];
  if(!st||!st.length){toast('Nothing to undo');return;}
  const prev=st.pop();prev.updatedAt=Date.now();
  S.matches[m.id]=prev;persist('matches',prev);
}
function nextFrame(m){
  if(m.status!=='live'||m.current.winner==null)return;
  (undoStacks[m.id]||(undoStacks[m.id]=[])).push(clone(m));
  m.current=newFrame(1-m.current.breaker,m.handicap);m.updatedAt=Date.now();persist('matches',m);
}
function finishMatch(m){
  (undoStacks[m.id]||(undoStacks[m.id]=[])).push(clone(m));
  const w0=framesWon(m,0),w1=framesWon(m,1);
  m.status='complete';m.winner=w0===w1?null:(w0>w1?0:1);m.endedAt=Date.now();
  if(m.current&&m.current.winner==null)m.current=null;
  m.updatedAt=Date.now();persist('matches',m);
}

/* ---------- personal bests ---------- */
function pbSnapshot(m){
  const f=m.current;
  return [0,1].map(i=>{let best=playerAgg(m.p[i]).hb;if(f)f.breaks.forEach(b=>{if(b.p===i&&b.pts>best)best=b.pts;});return best;});
}
function checkPB(m,before,newBreaks){
  newBreaks.forEach(b=>{
    const prev=before[b.p];if(b.pts<10||b.pts<=prev)return;
    const name=pn(m.p[b.p]);
    let msg=`🎉 New highest break for ${name}: ${b.pts}`+(prev?` (was ${prev})`:'');
    if(b.pts>=100&&prev<100)msg=`🏆 ${name}’s first century: ${b.pts}!`;
    else if(b.pts>=50&&prev<50)msg=`🎉 ${name}’s first 50+ break: ${b.pts}!`;
    celebrate(msg);before[b.p]=b.pts;
  });
}
function celebrate(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('pb');t.style.display='block';clearTimeout(toastT);toastT=setTimeout(()=>{t.style.display='none';t.classList.remove('pb');},5500);}

/* ---------- seasons ---------- */
function seasonOf(ts,type){const d=new Date(ts||0);return type==='year'?'y'+d.getFullYear():'m'+d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');}
function inSeason(m){const s=S.settings.season||'all';if(s==='all')return true;return seasonOf(m.startedAt,s[0]==='y'?'year':'month')===s;}
function seasonLabel(k){if(!k||k==='all')return 'All time';if(k[0]==='y')return k.slice(1);const [y,mo]=k.slice(1).split('-');return new Date(+y,+mo-1,1).toLocaleDateString('en-GB',{month:'long',year:'numeric'});}
function seasonOptions(){
  const ks=new Set();Object.values(S.matches).forEach(m=>{ks.add(seasonOf(m.startedAt,'year'));ks.add(seasonOf(m.startedAt,'month'));});
  ks.add(seasonOf(Date.now(),'month'));ks.add(seasonOf(Date.now(),'year'));
  const ys=[...ks].filter(k=>k[0]==='y').sort().reverse(),ms=[...ks].filter(k=>k[0]==='m').sort().reverse();
  return ['all',...ys,...ms];
}
function seasonSelect(){const cur=S.settings.season||'all';return `<select data-season="1" class="seasonsel">${seasonOptions().map(k=>`<option value="${k}" ${k===cur?'selected':''}>${k==='all'?'All time':(k[0]==='y'?'Season '+seasonLabel(k):seasonLabel(k))}</option>`).join('')}</select>`;}

/* ---------- stats ---------- */
function matchSide(m,i){
  const a={pts:0,pots:0,miss:0,saf:0,snk:0,fouls:0,foulPts:0,hb:0,b20:0,b50:0,b100:0,nb:0,bpts:0,fw:0,fp:0,shots:0,time:0};
  m.frames.forEach(f=>{
    a.fp++;if(f.winner===i)a.fw++;a.pts+=f.scores[i]-fstart(f,i);
    const s=f.stats[i];a.pots+=s.pots;a.miss+=s.miss;a.saf+=s.saf;a.snk+=s.snk||0;a.fouls+=s.fouls;a.foulPts+=s.foulPts;a.shots+=s.shots||0;a.time+=s.time||0;
    f.breaks.forEach(b=>{if(b.p!==i)return;a.hb=Math.max(a.hb,b.pts);if(b.pts>=20){a.b20++;a.nb++;a.bpts+=b.pts;}if(b.pts>=50)a.b50++;if(b.pts>=100)a.b100++;});

function playerAgg(pid,useSeason,skip){
  const a={mp:0,mw:0,ml:0,fp:0,fw:0,pts:0,pots:0,miss:0,saf:0,snk:0,fouls:0,foulPts:0,hb:0,b20:0,b50:0,b100:0,nb:0,bpts:0,shots:0,time:0,vs:{},list:[]};
  Object.values(S.matches).forEach(m=>{
    if(skip&&skip===m.id)return;
    if(useSeason&&!inSeason(m))return;
    const i=m.p.indexOf(pid);if(i<0)return;
    a.list.push(m);
    const opp=m.p[1-i];const v=a.vs[opp]||(a.vs[opp]={w:0,l:0,d:0,fw:0,fl:0});
    if(m.status==='complete'){a.mp++;if(m.winner===i){a.mw++;v.w++;}else if(m.winner===1-i){a.ml++;v.l++;}else v.d++;}
    const s=matchSide(m,i);
    v.fw+=s.fw;v.fl+=s.fp-s.fw;
    ['fp','fw','pts','pots','miss','saf','snk','fouls','foulPts','b20','b50','b100','nb','bpts','shots','time'].forEach(k=>a[k]+=s[k]);
    a.hb=Math.max(a.hb,s.hb);
  });
  a.list.sort((x,y)=>(y.startedAt||0)-(x.startedAt||0));
  return a;
}

function statRows(m){

  const rows=[

    ['Balls potted',x=>x.pots,1],['Pot success',x=>x.pots+x.miss?Math.round(x.pots*100/(x.pots+x.miss)):null,1,'%'],
    ['Avg shot time',x=>x.shots?Math.round(x.time/x.shots/1000):null,0,'s'],['Safeties',x=>x.saf,0],['Snookers laid',x=>x.snk,0],['Fouls',x=>x.fouls,-1],['Foul points given',x=>x.foulPts,-1],['Avg foul pts / frame',x=>x.fp?Math.round(x.foulPts*10/x.fp)/10:null,-1]

function resultImage(m){
  const n=[pn(m.p[0]),pn(m.p[1])],fw=[framesWon(m,0),framesWon(m,1)];

  const grd=g.createLinearGradient(0,0,0,H);grd.addColorStop(0,'#14513d');grd.addColorStop(1,'#08241a');g.fillStyle=grd;g.fillRect(0,0,W,H);
  const F='-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';

  [0,1].forEach(i=>{const x=i?W*0.75:W*0.25;g.fillStyle=m.winner===i?'#e8c468':'#f4f0e6';fit(n[i],440,64,700);g.fillText(n[i],x,300);});
  g.fillStyle='#f4f0e6';g.font=`800 230px ${F}`;g.fillText(fw[0]+'–'+fw[1],W/2,530);
  if(m.status==='complete'){g.fillStyle='#e8c468';fit(m.winner!=null?n[m.winner]+' wins':'Match drawn',900,52,700);g.fillText(m.winner!=null?n[m.winner]+' wins':'Match drawn',W/2,620);}
  let y=720;g.font=`600 30px ${F}`;g.fillStyle='#a8c2b5';g.fillText('FRAMES',W/2,y);y+=60;
  const fr=m.frames.slice(0,12);const cols=fr.length>6?2:1;
  fr.forEach((f,i)=>{const col=cols===2?(i<Math.ceil(fr.length/2)?0:1):0;const row=cols===2?(col?i-Math.ceil(fr.length/2):i):i;
    const x=cols===2?(col?W*0.72:W*0.28):W/2;g.font=`600 44px ${F}`;g.fillStyle='#f4f0e6';g.fillText(`${f.scores[0]} – ${f.scores[1]}`,x,y+row*62);});
  y+=Math.ceil(fr.length/cols)*62+30;
  const allB=[];m.frames.forEach(f=>f.breaks.forEach(b=>allB.push(b)));allB.sort((a,b)=>b.pts-a.pts);
  if(allB.length&&y<H-120){g.font=`600 30px ${F}`;g.fillStyle='#a8c2b5';g.fillText('TOP BREAKS',W/2,y);y+=58;
    allB.slice(0,3).forEach(b=>{if(y>H-60)return;g.font=`600 44px ${F}`;g.fillStyle='#e8c468';g.fillText(`${n[b.p]} ${b.pts}`,W/2,y);y+=58;});}
  return new Promise(r=>c.toBlob(r,'image/png'));
}
async function shareResult(m){
  const text=resultText(m);
  try{
    const blob=await resultImage(m);
    const file=new File([blob],'snooker-result.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],text});return;}
    if(navigator.share){await navigator.share({text});return;}
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='snooker-result.png';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},2000);
    try{await navigator.clipboard.writeText(text);toast('Image saved and result copied');}catch(e){toast('Image saved');}
  }catch(e){if(e&&e.name==='AbortError')return;try{await navigator.clipboard.writeText(text);toast('Result copied');}catch(e2){toast('Couldn’t share');}}
}

        <div class="tile"><div class="v">${ss.length}</div><div class="k">Sessions</div></div></div>`;
      const pts=ss.slice().reverse().slice(-30).map(x=>({x:fmtDate(x.startedAt),y:sessScore(x),tip:`${fmtDate(x.startedAt)}: ${sessLabel(x)}${x.type==='break'?' from '+x.attempts.length+' attempt'+(x.attempts.length===1?'':'s'):''}`}));
      h+=lineChart('Progress',pts,d.type==='attempts'?d.of:niceMax(Math.max(...pts.map(p=>p.y),10)),v=>Math.round(v),'Tap the chart for details.');

    }
  }else h+=`<p class="empty">Add a player to start practising.</p>`;
  return h;
}
function saveRun(r){try{localStorage.setItem('snooker-run',JSON.stringify(r));}catch(e){}}
function vPracRun(){
  const r=S.run;if(!r)return vPractice();
  const d=drillById(r.drill);
  let h=`<div class="top"><button class="back" data-act="askEndRun">‹ End</button><div class="title">${esc(d.name)} · ${esc(pn(r.player))}</div><span style="min-width:64px"></span></div>`;

      <div class="twobtn" style="margin-top:16px"><button class="btn primary big2" data-act="runShot" data-v="1">✓ Potted</button><button class="btn big2" data-act="runShot" data-v="0">✕ Missed</button></div>
      <button class="btn ghost" data-act="runUndo" ${r.shots.length?'':'disabled'}>↶ Undo</button>`;
  }else{

    h+=`<button class="redbtn" data-act="runPot" data-v="1">Red · 1</button>`;
    h+=`<div class="colours">`+BALLS.slice(1).map(b=>`<button class="ball ${b.dark?'dark':''}" style="background:radial-gradient(circle at 32% 30%, ${b.c}ee, ${b.c} 55%, #0008 140%)${b.v===7?';border:1px solid #444':''}" data-act="runPot" data-v="${b.v}" aria-label="${b.n}">${b.v}</button>`).join('')+`</div>`;
    h+=`<div class="twobtn" style="margin-top:14px"><button class="btn primary" data-act="runEndBreak">End break</button><button class="btn ghost" data-act="runUndo" ${r.cur.balls.length||r.attempts.length?'':'disabled'}>↶ Undo</button></div>`;
    if(r.attempts.length)h+=`<h2>Attempts</h2><div class="chips">`+r.attempts.map((a,i)=>`<span class="chip">${i+1}. <b>${a}</b></span>`).join('')+`</div>`;
  }

function finishRun(){
  const r=S.run;if(!r)return;
  if(r.type==='break'&&r.cur.pts>0){r.attempts.push(r.cur.pts);r.cur={pts:0,balls:[]};}
  const has=r.type==='attempts'?r.shots.length>0:r.attempts.length>0;
  S.run=null;try{localStorage.removeItem('snooker-run');}catch(e){}
  if(!has){go('drill',r.drill);return;}
  const d=drillById(r.drill);
  const prev=practiceFor(r.player,r.drill);const prevBest=prev.length?Math.max(...prev.map(sessScore)):null;
  const now=Date.now();
  const x={id:uid(),kind:'practice',player:r.player,drill:r.drill,type:r.type,startedAt:r.startedAt,endedAt:now,updatedAt:now};
  if(r.type==='attempts'){x.of=r.shots.length;x.made=r.shots.filter(Boolean).length;x.shots=r.shots;}
  else{x.attempts=r.attempts;x.best=Math.max(...r.attempts);x.total=r.attempts.reduce((a,b)=>a+b,0);}
  S.practice[x.id]=x;persist('matches',x);
  go('drill',r.drill);
  const sc=sessScore(x);
  if(prevBest!=null&&sc>prevBest)celebrate(`🎉 New ${d.name} record for ${pn(r.player)}: ${sessLabel(x)} (was ${prevBest})`);
  else toast('Session saved: '+sessLabel(x));
}

/* ---------- charts ---------- */
let chartN=0;
function niceMax(v){if(v<=10)return 10;const p=Math.pow(10,Math.floor(Math.log10(v)));const n=v/p;return (n<=2?2:n<=5?5:10)*p;}
function lineChart(title,pts,ymax,fmtY,note){
  if(pts.length<2)return '';
  const id='c'+(++chartN);const W=340,H=170,L=34,R=12,T=14,B=24,iw=W-L-R,ih=H-T-B;
  const x=i=>L+(pts.length===1?iw/2:i*iw/(pts.length-1)),y=v=>T+ih-(v/ymax)*ih;
  const grid=[0,ymax/2,ymax].map(g=>`<line x1="${L}" x2="${W-R}" y1="${y(g)}" y2="${y(g)}" class="cg"/><text x="${L-6}" y="${y(g)+4}" class="ct" text-anchor="end">${fmtY(g)}</text>`).join('');
  const path=pts.map((p,i)=>(i?'L':'M')+x(i).toFixed(1)+' '+y(p.y).toFixed(1)).join(' ');
  const step=iw/Math.max(1,pts.length-1);
  const hits=pts.map((p,i)=>`<rect x="${(x(i)-step/2).toFixed(1)}" y="${T}" width="${step.toFixed(1)}" height="${ih}" fill="transparent" data-act="tip" data-cap="${id}" data-tip="${esc(p.tip)}"/>`).join('');
  const dots=pts.map((p,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${y(p.y).toFixed(1)}" r="4" class="cd"/>`).join('');
  return `<h2>${title}</h2><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${grid}<path d="${path}" class="cl"/>${dots}${hits}
    <text x="${L}" y="${H-6}" class="ct">${esc(pts[0].x)}</text><text x="${W-R}" y="${H-6}" class="ct" text-anchor="end">${esc(pts[pts.length-1].x)}</text></svg>
    <div class="ccap" id="${id}">${esc(note)}</div></div>`;
}
function barChart(title,bars,note){
  if(!bars.some(b=>b.v))return '';
  const id='c'+(++chartN);const W=340,H=170,L=8,R=8,T=20,B=24,iw=W-L-R,ih=H-T-B;
  const max=Math.max(...bars.map(b=>b.v));const bw=iw/bars.length;
  const out=bars.map((b,i)=>{const h=b.v?Math.max(3,b.v/max*ih):0;const x0=L+i*bw+1,w=bw-2,y0=T+ih-h,r=Math.min(4,w/2,h);
    const bar=h?`<path d="M${x0} ${T+ih} V${y0+r} Q${x0} ${y0} ${x0+r} ${y0} H${x0+w-r} Q${x0+w} ${y0} ${x0+w} ${y0+r} V${T+ih} Z" class="cb"/><text x="${x0+w/2}" y="${y0-5}" class="cv" text-anchor="middle">${b.v}</text>`:'';
    return `${bar}<text x="${x0+w/2}" y="${H-7}" class="ct" text-anchor="middle">${b.k}</text><rect x="${x0}" y="${T}" width="${w}" height="${ih}" fill="transparent" data-act="tip" data-cap="${id}" data-tip="${esc(b.tip)}"/>`;}).join('');
  return `<h2>${title}</h2><div class="chart"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}"><line x1="${L}" x2="${W-R}" y1="${T+ih}" y2="${T+ih}" class="cg"/>${out}</svg><div class="ccap" id="${id}">${esc(note)}</div></div>`;
}
function playerCharts(pid,list){
  const asc=list.slice().sort((a,b)=>(a.startedAt||0)-(b.startedAt||0));
  let h='';
  // form strip
  const done=asc.filter(m=>m.status==='complete').slice(-10);
  if(done.length)h+=`<h2>Form · last ${done.length} matches</h2><div class="form">`+done.map(m=>{const i=m.p.indexOf(pid);const r=m.winner===i?'W':m.winner==null?'D':'L';
    return `<span class="fm ${r}" title="${esc(fmtDate(m.startedAt)+' v '+pn(m.p[1-i]))}">${r}</span>`;}).join('')+`</div>`;
  // win rate over time
  let w=0,c=0;const wr=[];
  asc.forEach(m=>{if(m.status!=='complete')return;const i=m.p.indexOf(pid);c++;if(m.winner===i)w++;
    wr.push({x:fmtDate(m.startedAt),y:Math.round(w*100/c),tip:`${fmtDate(m.startedAt)} v ${pn(m.p[1-i])}: ${m.winner===i?'won':m.winner==null?'drew':'lost'} · win rate ${Math.round(w*100/c)}%`});});
  h+=lineChart('Win rate over time',wr.slice(-40),100,v=>v+'%','Running match win %. Tap the chart for details.');
  // high break per match
  const hb=[];
  asc.forEach(m=>{const i=m.p.indexOf(pid);let best=0;m.frames.forEach(f=>f.breaks.forEach(b=>{if(b.p===i&&b.pts>best)best=b.pts;}));
    if(best>0)hb.push({x:fmtDate(m.startedAt),y:best,tip:`${fmtDate(m.startedAt)} v ${pn(m.p[1-i])}: best break ${best}`});});
  const hbs=hb.slice(-30);
  h+=lineChart('Highest break each match',hbs,niceMax(Math.max(...hbs.map(p=>p.y),10)),v=>Math.round(v),'Tap the chart for details.');
  // break distribution
  const bk=[[10,19,'10s'],[20,29,'20s'],[30,39,'30s'],[40,49,'40s'],[50,74,'50–74'],[75,99,'75–99'],[100,999,'100+']].map(([lo,hi,k])=>({k,lo,hi,v:0}));
  list.forEach(m=>{const i=m.p.indexOf(pid);m.frames.forEach(f=>f.breaks.forEach(b=>{if(b.p!==i)return;const t=bk.find(x=>b.pts>=x.lo&&b.pts<=x.hi);if(t)t.v++;}));});
  bk.forEach(b=>{b.tip=`${b.v} break${b.v===1?'':'s'} of ${b.k==='100+'?'100 or more':b.lo+'–'+b.hi}`;});
  h+=barChart('Break sizes',bk,'Number of breaks of 10 or more, by size.');
  return h;
}

function vPlayer(pid){
  const p=S.players[pid];
  if(!p)return `<div class="top"><button class="back" data-act="tab" data-v="players">‹ Players</button></div><p class="empty">Player not found.</p>`;
  const a=playerAgg(pid,true),all=playerAgg(pid);
  let h=`<div class="top"><button class="back" data-act="tab" data-v="players">‹ Players</button><button class="link" data-act="rename" data-id="${esc(pid)}">Rename</button></div><h1>${esc(p.name)}</h1>`+seasonSelect();
  const tile=(v,k)=>`<div class="tile"><div class="v">${v}</div><div class="k">${k}</div></div>`;
  h+=`<div class="tiles">`+
    tile(a.mp?`${a.mw}–${a.ml}`:'–','Matches W–L')+tile(pct(a.mw,a.mp),'Match win %')+tile(a.fp?`${a.fw}–${a.fp-a.fw}`:'–','Frames W–L')+
    tile(pct(a.fw,a.fp),'Frame win %')+tile(a.hb||'–','Highest break')+tile(a.nb?Math.round(a.bpts/a.nb):'–','Avg 20+ break')+
    tile(a.b20,'20+ breaks')+tile(a.b50,'50+ breaks')+tile(a.b100,'Centuries')+
    tile(a.fp?Math.round(a.pts/a.fp):'–','Avg pts / frame')+tile(pct(a.pots,a.pots+a.miss),'Pot success')+tile(a.fp?(a.fouls/a.fp).toFixed(1):'–','Fouls / frame')+tile(a.fp?(a.foulPts/a.fp).toFixed(1):'–','Avg foul pts / frame')+tile(a.pots,'Balls potted')+tile(a.saf,'Safeties')+tile(a.snk,'Snookers laid')+tile(a.shots?Math.round(a.time/a.shots/1000)+'s':'–','Avg shot time')+tile(a.fp?fmtDur(a.list.reduce((t,m)=>t+m.frames.reduce((u,f)=>u+(f.endedAt&&f.startedAt?f.endedAt-f.startedAt:0),0),0)/a.fp):'–','Avg frame time')+

  if(vs.length)h+=`<h2>Head to head</h2><div class="tablecard"><table><tr><th class="l">Opponent</th><th>Matches</th><th>Frames</th></tr>`+
    vs.map(([o,v])=>`<tr><td class="l" style="color:var(--text)">${esc(pn(o))}</td><td>${v.w}–${v.l}${v.d?'–'+v.d:''}</td><td>${v.fw}–${v.fl}</td></tr>`).join('')+`</table></div>`;
  if(a.list.length)h+=`<h2>Matches</h2>`+a.list.slice(0,20).map(matchCard).join('');
  else h+=`<p class="empty">No matches${S.settings.season!=='all'?' in '+esc(seasonLabel(S.settings.season)):''} yet.</p>`;
  if(!all.list.length&&!practiceFor(pid).length)h+=`<button class="btn danger" style="margin-top:20px" data-act="deletePlayer" data-id="${esc(pid)}">Delete player</button>`;
  return h;
}

  flip:()=>{
    const d=S.draft;const names=[d.p1?pn(d.p1):'Player 1',d.p2?pn(d.p2):'Player 2'];
    let r=Math.random();try{const a=new Uint32Array(1);crypto.getRandomValues(a);r=a[0]/4294967296;}catch(e){}
    const w=r<0.5?0:1;
    sheet(`<h3>Coin toss</h3><div class="coin spin" id="coin">?</div><div class="tossres" id="tossres"></div><button class="btn primary" id="tossok" data-act="closeSheet" style="visibility:hidden">OK</button>`);
    setTimeout(()=>{const c=document.getElementById('coin'),t=document.getElementById('tossres'),b=document.getElementById('tossok');if(!c)return;
      c.textContent=names[w];t.textContent=names[w]+' breaks off';b.style.visibility='visible';S.draft.brk=w;S.draft.brkTouched=true;render();},1400);
  },
  start:()=>{
    const d=S.draft;if(!d.p1||!d.p2||d.p1===d.p2)return;
    const now=Date.now();
    const hc=[+d.h0||0,+d.h1||0];const m={id:uid(),p:[d.p1,d.p2],bestOf:+d.bo,handicap:hc,frames:[],current:newFrame(d.brk,hc),firstBreaker:d.brk,status:'live',winner:null,startedAt:now,updatedAt:now,endedAt:null};
    S.matches[m.id]=m;d.touched=false;d.brkTouched=false;persist('matches',m);go('score',m.id);
  },
  pot:el=>{const m=curMatch();if(m){doPot(m,+el.dataset.v);render();}},
  miss:()=>{const m=curMatch();if(m){doEndTurn(m,'miss');render();}},
  safety:()=>{const m=curMatch();if(m){doEndTurn(m,'safety');render();}},
  snooker:()=>{const m=curMatch();if(m){doEndTurn(m,'snooker');render();}},
  foul:()=>{const m=curMatch();if(m&&m.current.winner==null){foulDraft={reds:0,again:false};foulSheet(m);}},
  fr:el=>{const m=curMatch();const max=m?m.current.reds:15;foulDraft.reds=Math.max(0,Math.min(max,foulDraft.reds+(+el.dataset.d)));const b=document.getElementById('frv');if(b)b.textContent=foulDraft.reds;},
  foulVal:el=>{const m=curMatch();if(!m)return;const ag=document.getElementById('fagain'),fr=document.getElementById('ffree');doFoul(m,+el.dataset.v,foulDraft.reds,!!(ag&&ag.checked),!!(fr&&fr.checked));closeSheet();render();},
  undo:()=>{const m=curMatch();if(m){doUndo(m);render();}},
  nextFrame:()=>{const m=curMatch();if(m){nextFrame(m);render();}},
  setTurn:el=>{const m=curMatch();if(!m||!m.current||m.current.winner!=null)return;const i=+el.dataset.i;if(m.current.turn===i)return;
    if(m.current.cur.pts>0){toast('Tap Miss or Safety to end the break');return;}
    act(m,f=>{f.stats[f.turn].visits++;leaveColour(f);f.turn=i;});render();},
  board:()=>{const m=curMatch();if(!m)return;go('board',m.id);try{const de=document.documentElement;if(de.requestFullscreen)de.requestFullscreen().catch(()=>{});}catch(e){}},
  share:el=>{const m=S.matches[el.dataset.id];if(m)shareResult(m);},
  edit:el=>{const m=S.matches[el.dataset.id];if(!m)return;S.edit={id:m.id,p:m.p.slice(),frames:clone(m.frames)};editSheet();},
  edBreaks:el=>breaksSheet(+el.dataset.i),
  edBack:()=>editSheet(),
  edCancel:()=>{S.edit=null;closeSheet();},
  edSave:()=>saveEdit(),
  edDelFrame:el=>{S.edit.frames.splice(+el.dataset.i,1);editSheet();},
  edDelBreak:el=>{S.edit.frames[+el.dataset.i].breaks.splice(+el.dataset.j,1);breaksSheet(+el.dataset.i);},
  edAddBreak:el=>{const i=+el.dataset.i;S.edit.frames[i].breaks.push({p:0,pts:10,balls:[]});breaksSheet(i);},
  tip:el=>{const c=document.getElementById(el.dataset.cap);if(c)c.textContent=el.dataset.tip;},
  openDrill:el=>go('drill',el.dataset.id),
  startDrill:el=>{const d=drillById(el.dataset.id);const pid=pracPlayer();if(!d||!pid)return;
    const prev=practiceFor(pid,d.id);
    S.run={drill:d.id,player:pid,type:d.type,of:d.of||0,startedAt:Date.now(),shots:[],made:0,attempts:[],cur:{pts:0,balls:[]},prevBest:prev.length&&d.type==='break'?Math.max(...prev.map(sessScore)):0,undo:[]};
    saveRun(S.run);go('pracRun');},
  runShot:el=>{const r=S.run;if(!r)return;r.shots.push(el.dataset.v==='1');r.made=r.shots.filter(Boolean).length;saveRun(r);
    if(r.shots.length>=r.of){finishRun();return;}render();},
  runPot:el=>{const r=S.run;if(!r)return;const v=+el.dataset.v;r.cur.pts+=v;r.cur.balls.push(v);
    if(r.prevBest&&r.cur.pts>r.prevBest&&r.cur.pts-v<=r.prevBest)celebrate(`🎉 New ${drillById(r.drill).name} record: ${r.cur.pts}!`);
    saveRun(r);render();},
  runEndBreak:()=>{const r=S.run;if(!r)return;r.attempts.push(r.cur.pts);r.cur={pts:0,balls:[]};saveRun(r);render();},
  runUndo:()=>{const r=S.run;if(!r)return;
    if(r.type==='attempts'){r.shots.pop();r.made=r.shots.filter(Boolean).length;}
    else if(r.cur.balls.length){r.cur.pts-=r.cur.balls.pop();}
    else if(r.attempts.length){const a=r.attempts.pop();r.cur={pts:a,balls:[a]};}
    saveRun(r);render();},
  finishRun:()=>finishRun(),
  askEndRun:()=>sheet(`<h3>End this practice?</h3><p>Save what you’ve done so far, or discard it.</p><button class="btn primary" data-act="finishRun">Save and finish</button><button class="btn danger" data-act="discardRun">Discard</button><button class="btn ghost" data-act="closeSheet">Keep practising</button>`),
  discardRun:()=>{const d=S.run&&S.run.drill;S.run=null;try{localStorage.removeItem('snooker-run');}catch(e){}go(d?'drill':'practice',d);},
  askDelSess:el=>sheet(`<h3>Delete this session?</h3><p>It will be removed from the practice history.</p><button class="btn danger" data-act="delSess" data-id="${esc(el.dataset.id)}">Delete</button><button class="btn ghost" data-act="closeSheet">Cancel</button>`),
  delSess:el=>{const id=el.dataset.id;delete S.practice[id];removeDoc('matches',id);closeSheet();render();},
  menu:()=>{const m=curMatch();if(m)menuSheet(m);},
  swap:()=>{const m=curMatch();if(!m)return;act(m,f=>{closeBreak(f);leaveColour(f);f.turn=1-f.turn;});closeSheet();render();},
  concede:el=>{const m=curMatch();if(!m)return;doConcede(m,+el.dataset.i);closeSheet();render();},
  askFinish:()=>{const m=curMatch();if(!m)return;const inProg=m.current&&m.current.winner==null&&(m.current.scores[0]||m.current.scores[1]);
    sheet(`<h3>Finish match now?</h3><p>The result will be recorded on frames won (${framesWon(m,0)}–${framesWon(m,1)}).${inProg?' The frame in progress won’t count.':''}</p><button class="btn primary" data-act="finish">Finish match</button><button class="btn ghost" data-act="closeSheet">Cancel</button>`);},
  finish:()=>{const m=curMatch();if(!m)return;finishMatch(m);go('match',m.id);},
  askDeleteMatch:el=>{const id=el.dataset.id;const m=S.matches[id];if(!m)return;
    sheet(`<h3>Delete this match?</h3><p>${esc(pn(m.p[0]))} v ${esc(pn(m.p[1]))}, ${fmtDate(m.startedAt)}. Its frames and breaks will be removed from everyone’s stats${S.group?', on every phone in the group':''}. This can’t be undone.</p><button class="btn danger" data-act="deleteMatch" data-id="${esc(id)}">Delete match</button><button class="btn ghost" data-act="closeSheet">Cancel</button>`);},
  deleteMatch:el=>{const id=el.dataset.id;delete S.matches[id];delete undoStacks[id];removeDoc('matches',id);go('history');},
  deletePlayer:el=>{const id=el.dataset.id;const p=S.players[id];if(!p)return;
    sheet(`<h3>Delete ${esc(p.name)}?</h3><p>They have no matches, so nothing else is affected.</p><button class="btn danger" data-act="confirmDeletePlayer" data-id="${esc(id)}">Delete player</button><button class="btn ghost" data-act="closeSheet">Cancel</button>`);},
  confirmDeletePlayer:el=>{const id=el.dataset.id;delete S.players[id];removeDoc('players',id);go('players');},
  rename:el=>{const p=S.players[el.dataset.id];if(!p)return;
    sheet(`<h3>Rename player</h3><input type="text" id="renameInp" value="${esc(p.name)}" maxlength="40" style="margin:10px 0"><button class="btn primary" data-act="saveRename" data-id="${esc(p.id)}">Save</button><button class="btn ghost" data-act="closeSheet">Cancel</button>`);
    setTimeout(()=>{const i=document.getElementById('renameInp');if(i)i.focus();},50);},
  saveRename:el=>{const p=S.players[el.dataset.id];const i=document.getElementById('renameInp');if(!p||!i)return;const nm=i.value.trim().replace(/\s+/g,' ');if(!nm)return;
    if(Object.values(S.players).some(x=>x.id!==p.id&&x.name.toLowerCase()===nm.toLowerCase())){toast('That name is taken');return;}
    p.name=nm;persist('players',p);closeSheet();render();}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  const fn=ACTIONS[el.dataset.act];if(fn){e.preventDefault();fn(el);}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.draft){S.draft.touched=true;const k=t.dataset.draft;S.draft[k]=(k==='bo'||k==='h0'||k==='h1')?+t.value:t.value;render();}
  else if(t.dataset&&t.dataset.filter){S.histFilter=t.value;render();}
  else if(t.dataset&&t.dataset.setting){S.settings[t.dataset.setting]=t.type==='checkbox'?t.checked:t.value;saveSettings();render();}
  else if(t.dataset&&t.dataset.ew&&S.edit){S.edit.frames[+t.dataset.ew].winner=+t.value;}
  else if(t.dataset&&t.dataset.ebp&&S.edit){const [i,j]=t.dataset.ebp.split(':').map(Number);S.edit.frames[i].breaks[j].p=+t.value;}
  else if(t.dataset&&t.dataset.pracplayer){S.pracPlayer=t.value;render();}
  else if(t.dataset&&t.dataset.season){S.settings.season=t.value;saveSettings();render();}
  else if(t.id==='importFile'&&t.files&&t.files[0]){importData(t.files[0]);t.value='';}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='addName'){e.preventDefault();addPlayer();}
  else if(e.target.id==='grpName'){e.preventDefault();ACTIONS.doCreate();}
  else if(e.target.id==='grpCode'){e.preventDefault();ACTIONS.doJoin();}
  else if(e.target.id==='renameInp'){e.preventDefault();const b=document.querySelector('[data-act="saveRename"]');if(b)ACTIONS.saveRename(b);}
});
init();
</script>
</body>
</html>
